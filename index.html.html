    const settling=waveSmooth(116/180,126/180,t)*(1-waveSmooth(130/180,158/180,t));
    if(!reflectionGradient||lastMaterialAngle!==angle){
      upperGradient=rowMaterial(false,t,back,waterline);
      reflectionGradient=rowMaterial(true,t,back,waterline);lastMaterialAngle=angle;
    }
    for(let row=0;row<2;row++){
      const lower=row===1,direction=lower?1:-1;
      ctx.save();ctx.beginPath();
      const seam=scale*.015;
      if(lower)ctx.rect(0,waterline+seam,W,H-waterline-seam);
      else ctx.rect(0,0,W,waterline-seam);
      ctx.clip();ctx.fillStyle=lower?reflectionGradient:upperGradient;ctx.beginPath();
      for(let k=0;k<geometry.pairs.length;k++){
        const pair=geometry.pairs[k],outline=rowOutlines[row][k],anchor=rowAnchors[k];
        const progress=waveFormation(anchor[0],anchor[row+1],t),layout=back?1-progress:progress;
        const reflection=lower?1-layout:layout;
        for(let i=0;i<outline.length;i++){
          fixedRowVertex(pair,i,lower,layout,outline[i]);
          const x=outline[i][0],y=outline[i][1],px=(x-cx)/scale,py=(y-cy)/scale;
          const depth=Math.abs(py-.65),flow=reducedMotion?0:surfaceTime;
          const wet=smooth(0,.18,depth),deep=smooth(0,1.45,depth);
          const driftPhase=depth*4.6+px*.74-flow*.48+.16*Math.sin(flow*.17+px*.45);
          const bandPhase=depth*40+px*.48-flow*.95+.70*Math.sin(depth*3.2+px*.45-flow*.19);
          const band=Math.sin(bandPhase)+.18*Math.sin(2*bandPhase+.7),detail=waveSmooth(28,60,scale);
          const ambientX=.30*Math.sin(driftPhase)+.72*band
            +(.20+.10*deep)*detail*Math.sin(depth*76-px*1.05+flow*.67+.45*Math.sin(depth*2.8-flow*.23));
          const ambientY=Math.sin(px*2.1+depth*2.8-flow*.27)+.20*Math.sin(px*3.8-depth*4.4+flow*.19);
          const sway=clamp(scale*.095,2.2,5.5)/scale*(.36+.64*deep),ambientGain=1-.22*tension;
          reflectedWave(px,py,t,tension);
          const ambientResponse=mix(.42,1,reflection);
          const gain=(mix(.72,.90,reflection)*wet+.35*reassembly+.55*settling)/.90;
          const xx=x-scale*sway*ambientX*ambientGain*ambientResponse*wet+scale*ringPush[0]*gain;
          const yy=y-scale*(.005+.006*deep)*ambientY*ambientGain*ambientResponse*wet*direction+scale*ringPush[1]*gain;
          if(i)ctx.lineTo(xx,yy);else ctx.moveTo(xx,yy);
        }
        ctx.closePath();
      }
      ctx.fill('nonzero');ctx.restore();
    }
    display.setTransform(1,0,0,1,0,0);
    drawSurfaceRipples(t,tension);
    display.drawImage(surface,0,0);
  }
  function resize(){
    W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
    surface.width=canvas.width;surface.height=canvas.height;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    cx=W/2;cy=H/2;
    const header=document.querySelector('header').getBoundingClientRect(),footer=document.querySelector('footer').getBoundingClientRect();
    const room=clean?H*.78:Math.max(70,2*Math.min(cy-header.bottom-22,footer.top-cy-22));
    scale=Math.min(94,(W-48)/7.8,room/3.9);
    cy-=scale*.35;
    reflectionGradient=null;lastLightAngle=NaN;lastPaint=NaN;paint(current);
  }
  function stage(p){
    const a=p*360,t=a%180;
    if(t<.5)return a<1?'01 / 你看看別人': '05 / 第二句・整句倒置';
    if(t<42)return '02 / 倒影隨水面起伏';
    if(t<75)return '03 / 波動蓄積・漣漪展開';
    if(t<90)return '04 / 漣漪全面展開';
    if(t<120)return '04 / 筆畫隨波重組';
    if(t<150)return '05 / 新的話語成形';
    return '06 / 漣漪逐漸平復';
  }
  /* Existing interface, device quaternion integration and controls below. */
  function updateUI() {
    $('angle').textContent=current.toFixed(1).padStart(5,'0')+'\u00b0';
    const displayed=Math.abs(current-360)<.02?360:cycle(current);
    $('angle').textContent=displayed.toFixed(1).padStart(5,'0')+'°';
    if(!scrubbing)$('scrub').value=displayed;
    $('scrub').style.setProperty('--progress',(displayed/3.6)+'%');
    $('stage').textContent=stage(cycle(current)/360);
    $('play').textContent=auto?UI.pause:UI.play;
    $('gyro').textContent=sensor?UI.gyroOff:UI.gyro;
    $('mode').textContent=sensor?UI.modeGyro:auto?UI.modeAuto:UI.modeManual;
  }
  function say(message) {$('status').textContent=message;}
  function detachSensor() {
    sensor=false;sensorTextAnchor=null;prevQ=null;rawHeading=null;clearTimeout(timeoutID);
    window.removeEventListener('deviceorientation',onOrientation);
  }
  function manual(angle,immediate=false) {
    auto=false;textHoldRemaining=0;detachSensor();target=Number.isFinite(Number(angle))?Number(angle):0;
    if(immediate){current=target;vel=0;paint(current);}
    say(UI.manualHelp);updateUI();
  }
  function startAuto() {
    detachSensor();
    autoOrigin=current;autoBegin=performance.now();filteredPlaybackRate=pursuitPlaybackRate;
    textHoldRemaining=Math.abs(current/180-Math.round(current/180))<.00001?TEXT_HOLD_SECONDS:0;
    auto=true;
    say(UI.previewHelp);updateUI();
  }
  function tick(now) {
    const dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;
    if(auto) {
      if(textHoldRemaining>0)textHoldRemaining=Math.max(0,textHoldRemaining-dt);
      else {const boundary=direction>0?(Math.floor(target/180)+1)*180:(Math.ceil(target/180)-1)*180;
        const next=target+dt*8*direction;
        if(direction>0?next>=boundary:next<=boundary){target=boundary;current=boundary;vel=0;textHoldRemaining=TEXT_HOLD_SECONDS;}else target=next;}
    }
    // Analytic, critically damped spring. Frame-rate independent, no bouncing.
    if(sensor){
      // Sensor deltas have already been shortest-angle unwrapped. Filter the
      // continuous angle so 359 -> 0 never takes a full reverse turn.
      const textAngle=Math.round(target/180)*180;
      if(sensorTextAnchor!==null&&Math.abs(target-sensorTextAnchor)>3)sensorTextAnchor=null;
      if(sensorTextAnchor===null&&Math.abs(target-textAngle)<=1.5)sensorTextAnchor=textAngle;
      current=sensorTextAnchor!==null?sensorTextAnchor:mix(current,target,1-Math.exp(-dt/.055));
      vel=0;
      if(sensorTextAnchor===null&&Math.abs(current-target)<.025)current=target;
    }
    const omega=24,decay=Math.exp(-omega*dt),err=current-target;
    const t=(vel+omega*err)*dt;
    if(!sensor){current=target+(err+t)*decay;vel=(vel-omega*t)*decay;}

    if((!sensor||sensorTextAnchor===null)&&Math.abs(current-target)<.0005&&Math.abs(vel)<.005){current=target;vel=0;}
    surfaceTime=now/1000;if(!reducedMotion)lastPaint=NaN;frameStep=dt*60;paint(current);
    frameMS=frameMS*.97+dt*1000*.03;
    // Do not rebuild particle identities in the middle of a transition.
    if(now-lastUI>50){updateUI();lastUI=now;}
    requestAnimationFrame(tick);
  }
  $('play').addEventListener('click',()=>{
    if(auto){auto=false;target=current;vel=0;say(UI.paused);}else startAuto();
    updateUI();
  });
  $('reset').addEventListener('click',()=>{manual(0,true);say(UI.ready);});
  $('scrub').addEventListener('input',e=>manual(e.target.value));
  $('scrub').addEventListener('pointerdown',()=>{scrubbing=true;auto=false;detachSensor();});
  window.addEventListener('pointerup',()=>{scrubbing=false;});
  window.addEventListener('pointercancel',()=>{scrubbing=false;});
  document.querySelectorAll('[data-angle]').forEach(b=>b.addEventListener('click',()=>manual(Number(b.dataset.angle))));
  window.addEventListener('keydown',e=>{
    if(['INPUT','TEXTAREA','SELECT','BUTTON','SUMMARY'].includes(e.target.tagName))return;
    if(e.code==='Space'){e.preventDefault();$('play').click();}
    else if(e.key==='ArrowRight'){e.preventDefault();manual(target+(e.shiftKey?15:3));}
    else if(e.key==='ArrowLeft'){e.preventDefault();manual(target-(e.shiftKey?15:3));}
    else if(e.key==='Home'){e.preventDefault();manual(0);}
    else if(e.key==='End'){e.preventDefault();manual(360);}
    else if(e.key==='Escape'){setClean(false);$('options').open=false;}
  });
  let dragging=false,dragX=0,dragAngle=0;
  canvas.addEventListener('pointerdown',e=>{manual(current);dragging=true;dragX=e.clientX;dragAngle=current;canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');});
  canvas.addEventListener('pointermove',e=>{if(dragging)target=dragAngle+(e.clientX-dragX)*360/Math.max(280,W);});
  function dragEnd(){dragging=false;canvas.classList.remove('dragging');}
  canvas.addEventListener('pointerup',dragEnd);canvas.addEventListener('pointercancel',dragEnd);
  // W3C orientation order: Rz(alpha) * Rx(beta) * Ry(gamma).
  // Relative quaternion twist around the DEVICE Z axis tracks rotating the
  // phone like a dial, unlike alpha alone (which tracks the earth Z axis).
  const qNow=new Float64Array(4),qPrevious=new Float64Array(4);
  function onOrientation(e) {
    if(!sensor||!Number.isFinite(e.alpha)||!Number.isFinite(e.beta)||!Number.isFinite(e.gamma))return;
    if(!sensorGotData){sensorGotData=true;clearTimeout(timeoutID);say(UI.sensorHelp);}
    let delta=0;
    if(sensorType==='heading'){
      const raw=e.alpha;
      if(rawHeading===null){rawHeading=raw;return;}
      delta=raw-rawHeading;rawHeading=raw;
      if(delta>180)delta-=360;if(delta< -180)delta+=360;
      // Heading unwrap: 359 -> 0 advances +1; 0 -> 359 retreats -1.
    }else{
      const a=e.alpha*DEG/2,b=e.beta*DEG/2,g=e.gamma*DEG/2;
      const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
      qNow[0]=ca*sb*cg-sa*cb*sg;qNow[1]=ca*cb*sg+sa*sb*cg;
      qNow[2]=ca*sb*sg+sa*cb*cg;qNow[3]=ca*cb*cg-sa*sb*sg;
      if(prevQ===null){qPrevious.set(qNow);prevQ=true;return;}
      let w=qPrevious[3]*qNow[3]+qPrevious[0]*qNow[0]+qPrevious[1]*qNow[1]+qPrevious[2]*qNow[2];
      let z=qPrevious[3]*qNow[2]-qPrevious[2]*qNow[3]-qPrevious[0]*qNow[1]+qPrevious[1]*qNow[0];
      // Measure each change in the previous device frame, then advance the baseline.
      qPrevious.set(qNow);
      if(w<0){w=-w;z=-z;}
      if(Math.hypot(w,z)<1e-8)return;
      delta=-2*Math.atan2(z,w)/DEG;
      if(delta>180)delta-=360;if(delta< -180)delta+=360;
    }
    // Reject a sensor restart/outlier, not normal wraparound.
    if(!Number.isFinite(delta)||Math.abs(delta)>55)return;
    // Unbounded accumulated sensor angle; wrap is handled in the delta above.
    accum+=delta*direction*sensitivity;
    target=accum;
  }
  async function enableGyro() {
    if(sensor){detachSensor();say(UI.manualHelp);updateUI();return;}
    auto=false;
    if(!window.isSecureContext){say(UI.needHTTPS);updateUI();return;}
    if(!('DeviceOrientationEvent' in window)){say(UI.noSensor);updateUI();return;}
    try {
      // Called directly by a user gesture: necessary for the iOS permission UI.
      if(typeof DeviceOrientationEvent.requestPermission==='function') {
        const result=await DeviceOrientationEvent.requestPermission();
        if(result!=='granted'){say(UI.denied);updateUI();return;}
      }
      sensor=true;sensorGotData=false;sensorTextAnchor=null;prevQ=null;rawHeading=null;
      accum=0;target=0;current=0;vel=0;paint(0);
      window.addEventListener('deviceorientation',onOrientation,{passive:true});
      say(UI.waitSensor);updateUI();
      timeoutID=setTimeout(()=>{
        if(!sensorGotData){detachSensor();say(UI.noData);updateUI();}
      },4500);
    }catch(err){detachSensor();say(UI.permissionError+' '+(err.message||''));updateUI();}
  }
  $('gyro').addEventListener('click',enableGyro);
  $('calibrate').addEventListener('click',()=>{
    accum=0;sensorTextAnchor=null;prevQ=null;rawHeading=null;target=0;current=0;vel=0;auto=false;paint(0);say(UI.calibrated);updateUI();
  });
  $('axis').addEventListener('change',e=>{
    sensorType=e.target.value;sensorTextAnchor=null;prevQ=null;rawHeading=null;accum=current;say(UI.axisChanged);
  });
  $('direction').addEventListener('change',e=>{direction=e.target.checked?-1:1;sensorTextAnchor=null;prevQ=null;rawHeading=null;accum=current;});
  $('sensitivity').addEventListener('change',e=>{sensitivity=Number(e.target.value);sensorTextAnchor=null;accum=current;});
  function setClean(on) {
    clean=on;document.body.classList.toggle('clean',on);
    $('restore').hidden=!on||lockedForCapture;
    resize();
  }
  $('clean').addEventListener('click',()=>setClean(true));
  $('restore').addEventListener('click',()=>setClean(false));
  $('fullscreen').addEventListener('click',async()=>{
    try{
      if(!document.fullscreenElement&&document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
        try{await screen.orientation.lock('portrait');}catch(_){/* optional */}
      }else if(document.fullscreenElement)await document.exitFullscreen();
      else say(UI.noFullscreen);
    }catch(_){say(UI.noFullscreen);}
  });
  document.addEventListener('visibilitychange',()=>{
    last=performance.now();prevQ=null;rawHeading=null;
    if(document.hidden){auto=false;target=current;vel=0;}
  });
  let resizeTimer;
  window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,120);},{passive:true});



  document.querySelectorAll('[data-label]').forEach(el=>el.textContent=UI[el.dataset.label]||'');
  document.querySelector('.brand').innerHTML='FOR YOUR OWN GOOD<br>RIPPLE STUDY / 比較';
  document.querySelector('.sr-only').textContent=UI.description;
  canvas.setAttribute('aria-label',UI.description);
  $('scrub').setAttribute('aria-label',UI.rangeLabel);
  window.vortex=window.ripple={setAngle:a=>manual(a,true),getStats:()=>({angle:current,target,width:W,height:H,sensor,auto,contours:geometry.pairs.length}),getSource:()=>DATA,setClean,vertex:(k,i,a)=>vertex(geometry.pairs[k],i,a)};
  window.ripple.ready=Promise.resolve().then(()=>{ready=true;resize();say(UI.ready);updateUI();if(params.has('angle'))manual(Number(params.get('angle')),true);if(lockedForCapture)setClean(true);});
  requestAnimationFrame(tick);
})();
</script></body></html>
